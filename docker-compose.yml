# ==============================================
# DocVault - Docker Compose
# ==============================================
# Provides PostgreSQL for local development.
# Usage: docker compose up -d
# ==============================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: docvault-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: docvault_user
      POSTGRES_PASSWORD: docvault_dev_password
      POSTGRES_DB: docvault
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U docvault_user -d docvault']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Security: limit shared memory size
    shm_size: '256mb'

volumes:
  postgres-data:
    driver: local
